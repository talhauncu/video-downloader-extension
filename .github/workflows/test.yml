name: tests

on:
  push:
  pull_request:

# The jobs only read the repository.
permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Vendored files are the npm packages' files (SHA-256)
        run: npm run check:vendor
      - name: The Firefox build passes Mozilla's add-on linter (addons.mozilla.org runs the same)
        run: |
          npm run build:firefox
          npx web-ext lint --source-dir dist/firefox

  package:
    # Dry run of the release package: the zip builds and holds a loadable extension.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm run package -- --firefox
      - name: Zip holds the manifest, locales, sources and licenses
        run: |
          zip=$(ls dist/video-downloader-[0-9]*.zip)
          unzip -l "$zip" | grep -E ' manifest\.json$'
          unzip -l "$zip" | grep -E ' _locales/en/messages\.json$'
          unzip -l "$zip" | grep -E ' src/background/service-worker\.js$'
          unzip -l "$zip" | grep -E ' licenses/GPL-2\.0\.txt$'
          ! unzip -l "$zip" | grep -E ' (test|node_modules)/'
      - name: The Firefox zip holds a Firefox manifest and no multi-threaded core
        run: |
          zip=$(ls dist/video-downloader-firefox-*.zip)
          unzip -p "$zip" manifest.json | grep -F '"gecko"'
          unzip -l "$zip" | grep -E ' src/offscreen/offscreen\.js$'
          ! unzip -l "$zip" | grep -E ' src/vendor/ffmpeg-mt/'
      - name: A tag that does not match the manifest is refused
        run: '! node scripts/package.js --check-tag v0.0.0'

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Playwright version
        id: pw
        run: echo "version=$(node -e "console.log(require('@playwright/test/package.json').version)")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium-firefox
      - name: Install Chromium and Firefox (and system deps)
        run: npx playwright install --with-deps chromium firefox --no-shell
        timeout-minutes: 8
      - run: npm run e2e
        timeout-minutes: 8
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
