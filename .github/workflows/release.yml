name: release

# A v* tag (pushed after a PR is merged) publishes the packaged extension.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Package (the tag must match manifest.json's version)
        run: node scripts/package.js --check-tag "$GITHUB_REF_NAME"
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/video-downloader-*.zip --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
