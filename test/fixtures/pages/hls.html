<!doctype html>
<html lang="tr">
<head><meta charset="utf-8"><title>HLS Oynatıcı Sayfası</title></head>
<body>
  <h1>HLS</h1>
  <p>Oynatıcı, <code>?src=</code> ile verilen playlist'i XHR ile ister (gerçek oynatıcılar gibi).</p>
  <script>
    const src = new URLSearchParams(location.search).get('src');
    if (src) fetch(src).then((r) => r.text()).then((t) => { document.body.dataset.playlistLoaded = String(t.length > 0); });
  </script>
</body>
</html>
