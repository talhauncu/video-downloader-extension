<body>
  <main id="feed"></main>
  <script>
    // Feed posts: header with the user link, an MSE (blob:) video, footer with the post link.
    const posts = [['sponsor', 'SPONSOR001', 60], ['ikinci', 'FEEDPOST02', 4], ['ucuncu', 'FEEDPOST03', 4]];
    for (const [user, code, duration] of posts) {
      const article = document.createElement('article');
      // Like reels: the track's page (/reels/audio/<id>/) is linked before the post itself.
      article.innerHTML = `<header><a href="/${user}/">${user}</a> · <a href="/reels/audio/1234567890${code.length}/">Orijinal ses</a></header><div class="media"><video muted playsinline data-code="${code}"></video></div>`
        + `<footer><a href="/p/${code}/"><time>2 sa</time></a></footer>`;
      document.getElementById('feed').appendChild(article);
      const video = article.querySelector('video');
      const ms = new MediaSource();
      video.src = URL.createObjectURL(ms);
      ms.addEventListener('sourceopen', () => { ms.duration = duration; });
    }
    document.body.dataset.feedReady = 'true';
  </script>
</body>
